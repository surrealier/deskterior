name: Release

# Pushing a tag vX.Y.Z builds the universal app, attests the zip and publishes a GitHub release
# (docs/DESIGN.md §6). Signing is ad-hoc unless the optional SIGNING_P12_* secrets exist (docs/SIGNING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check version
        # The tagged commit carries the release: a dated CHANGELOG heading and the same DeskCore.version.
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[$v\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "CHANGELOG has no dated [$v]"; exit 1; }
          grep -q "version = \"$v\"" Sources/DeskCore/DeskCore.swift || { echo "DeskCore.version is not $v"; exit 1; }
      - name: Toolchain
        run: swift --version && xcode-select -p
      - name: Build
        run: swift build
      - name: Test
        run: scripts/swift-test.sh
        env:
          # As in ci.yml: the desk-plane physics tests need a Metal device; fail rather than skip them.
          DESKTERIOR_REQUIRE_METAL: "1"
      - name: File-safety lint
        run: scripts/check-file-safety.sh

  release:
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Secrets cannot appear in `if:` directly.
      HAS_P12: ${{ secrets.SIGNING_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # CFBundleVersion = git rev-list --count HEAD

      - name: Import signing identity
        if: env.HAS_P12 == 'true'
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: scripts/ci-import-identity.sh

      - name: Build universal app
        # Tag vX.Y.Z → version X.Y.Z; the bundle id is io.github.<owner>.deskterior (origin remote, else
        # GITHUB_REPOSITORY_OWNER).
        run: ARCHS="arm64 x86_64" ZIP=1 scripts/build-app.sh --version "${GITHUB_REF_NAME#v}"

      - name: Verify
        run: |
          codesign --verify --strict --verbose=2 build/Deskterior.app
          codesign -d -r - build/Deskterior.app
          lipo build/Deskterior.app/Contents/MacOS/Deskterior -verify_arch arm64 x86_64
          plutil -lint build/Deskterior.app/Contents/Info.plist
          info() { plutil -extract "$1" raw -o - build/Deskterior.app/Contents/Info.plist; }
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          [ "$(info CFBundleIdentifier)" = "io.github.$owner.deskterior" ] ||
            { echo "bundle id $(info CFBundleIdentifier) is not io.github.$owner.deskterior"; exit 1; }
          v="${GITHUB_REF_NAME#v}"
          [ "$(info CFBundleShortVersionString)" = "${v%%[-+]*}" ] ||
            { echo "CFBundleShortVersionString $(info CFBundleShortVersionString) is not ${v%%[-+]*}"; exit 1; }
          (cd build && shasum -a 256 -c Deskterior-*.zip.sha256)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/Deskterior-*.zip

      - name: Release notes
        run: |
          sed -e '/^<!-- Template/d' -e "s|__VERSION__|${GITHUB_REF_NAME#v}|g" \
            -e "s|__REPO__|${GITHUB_REPOSITORY}|g" .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes file comes first; GitHub's generated notes (changes since the last tag) follow it. A tag with a
        # pre-release suffix (v0.2.0-rc.1) makes a pre-release.
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" build/Deskterior-*.zip build/Deskterior-*.zip.sha256 \
            --title "Deskterior ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes \
            --verify-tag ${prerelease[@]+"${prerelease[@]}"}

      - name: Delete signing keychain
        if: always()
        run: scripts/ci-import-identity.sh cleanup
