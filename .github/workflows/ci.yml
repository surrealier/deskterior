name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    env:
      # The desk-plane physics tests need a Metal device (SpriteKit steps Box2D); fail rather than skip them.
      DESKTERIOR_REQUIRE_METAL: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchain
        run: swift --version && xcode-select -p
      - name: Build
        run: swift build
      - name: Build tests
        id: build-tests
        timeout-minutes: 20
        run: scripts/ci-test.sh build
      # scripts/ci-test.sh runs the app tests one at a time and the rest in parallel, and reruns a group's failed tests
      # once: a flake passes with a warning annotation, a test that fails twice fails the job. A hung test fails its
      # step with a log instead of holding the job for GitHub's 6-hour limit.
      - name: Test (app sessions, one at a time)
        timeout-minutes: 20
        run: scripts/ci-test.sh serial --skip-build
      - name: Test (other targets, in parallel)
        # Also after an app-test failure, so one run reports both groups.
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        timeout-minutes: 30
        run: scripts/ci-test.sh parallel --skip-build
      - name: File-safety lint
        run: scripts/check-file-safety.sh
      # Galmuri9 as CoreText draws it, for platforms without CoreText (docs/WINDOWS.md WP4). GlyphAtlasTests fails
      # when the committed atlas differs; the freshly baked one is uploaded so it can be committed.
      - name: Bake glyph atlas
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build
          swift run deskterior-assets bake-font --out build/Galmuri9.glyphs
          cmp build/Galmuri9.glyphs Resources/Fonts/Galmuri9.glyphs || echo "::warning::Resources/Fonts/Galmuri9.glyphs is out of date"
      - name: Upload glyph atlas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Galmuri9-glyphs
          path: build/Galmuri9.glyphs
          retention-days: 7
      - name: Build app bundle (arm64, ad-hoc)
        # The bundle id comes from the checkout's origin remote (io.github.<owner>.deskterior).
        run: ARCHS=arm64 ZIP=1 scripts/build-app.sh --version 0.0.0-ci
      - name: Upload app
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The ditto zip keeps the executable bit and the signature; an uploaded .app folder would lose them.
          name: Deskterior-ci
          path: build/Deskterior-0.0.0-ci.zip
          retention-days: 7

  # Windows (docs/WINDOWS.md): the targets that are portable so far, built and tested with the swift.org toolchain.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchain
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - name: Version
        run: swift --version
      - name: Build
        timeout-minutes: 30
        run: swift build
      - name: Build tests
        timeout-minutes: 30
        run: swift build --build-tests
      - name: Test
        timeout-minutes: 30
        run: swift test --skip-build
