name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && xcode-select -p
      - name: Build
        run: swift build
      - name: Test
        run: scripts/swift-test.sh
      - name: File-safety lint
        run: scripts/check-file-safety.sh
      - name: Build app bundle (arm64, ad-hoc)
        run: ARCHS=arm64 scripts/build-app.sh --version 0.0.0-ci
      - name: Upload app
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Deskterior-ci
          path: build/Deskterior.app
          retention-days: 7
