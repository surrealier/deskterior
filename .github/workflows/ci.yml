name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && xcode-select -p
      - name: Build
        run: swift build
      - name: Test
        run: scripts/swift-test.sh
        env:
          # The desk-plane physics tests need a Metal device (SpriteKit steps Box2D); fail rather than skip them.
          DESKTERIOR_REQUIRE_METAL: "1"
      - name: File-safety lint
        run: scripts/check-file-safety.sh
      - name: Build app bundle (arm64, ad-hoc)
        # The bundle id comes from the checkout's origin remote (io.github.<owner>.deskterior).
        run: ARCHS=arm64 ZIP=1 scripts/build-app.sh --version 0.0.0-ci
      - name: Upload app
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          # The ditto zip keeps the executable bit and the signature; an uploaded .app folder would lose them.
          name: Deskterior-ci
          path: build/Deskterior-0.0.0-ci.zip
          retention-days: 7
